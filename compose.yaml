services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
      - 'TZ=UTC'
      - 'PGTZ=UTC'
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    ports:
      - '5433:5432'
